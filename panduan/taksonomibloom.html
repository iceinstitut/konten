    <style>
        :root {
            --brand-color: #ee1522;
            --brand-dark: #c1121d;
            --primary-soft: rgba(238, 21, 34, 0.08);
            --border-color: #e5e7eb;
            --text-dark: #1a1a1a;
        }

        h1 {
            font-weight: 800;
            font-size: 2rem;
            color: var(--text-dark);
            margin-bottom: 1.5rem;
            border-left: 6px solid var(--brand-color);
            padding-left: 1rem;
            text-transform: uppercase;
        }

        .input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        .input:focus {
            border-color: var(--brand-color);
            box-shadow: 0 0 0 3px rgba(238, 21, 34, 0.15);
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            min-width: 700px;
            text-align: left;
        }

        th {
            background-color: #f9fafb;
            color: var(--text-dark);
            padding: 1rem;
            border-bottom: 2px solid var(--brand-color);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            border-right: 1px solid var(--border-color);
        }

        th:last-child {
            border-right: none;
        }

        td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            color: #374151;
        }

        td:last-child {
            border-right: none;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: var(--primary-soft);
        }

        .highlight {
            background-color: #fef08a;
            padding: 0 2px;
            border-radius: 2px;
            font-weight: 600;
        }

        .empty-cell {
            color: #9ca3af;
            font-style: italic;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
            display: none;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-color); }
    </style>

<div>

</div>

        ["Mempelajari", "Merangkum", "Menemukan Kembali", "Membagankan", "Merentangkan", "Memfasilitasi"],

        ["", "", "Memanipulasi", "Mengoptimalkan", "", "Membuat Model"],
        ["", "", "Mempercantik", "Memerintahkan", "", "Improvisasi"],
        ["", "", "Mengoperasikan", "Menggarisbesarkan", "", "Membuat Jaringan"],
        ["", "", "Mempersoalkan", "Memberi Tanda/Kode", "", "Mengorganisasikan"],
        ["", "", "", "Mprioritaskan", "", "Mensketsa"],
        ["", "", "", "Mengedit", "", "Mereparasi"]
    ];

    const tbody = document.getElementById('tableBody');
    const noResultsEl = document.getElementById('noResults');

    function renderTable(filter = "") {
        tbody.innerHTML = "";
        let visibleCount = 0;
        const lowerFilter = filter.toLowerCase().trim();

        data.forEach(row => {
            const rowMatches = lowerFilter === "" || row.some(cell => cell && cell.toLowerCase().includes(lowerFilter));

            if (rowMatches) {
                visibleCount++;
                const tr = document.createElement('tr');
                
                row.forEach(cell => {
                    const td = document.createElement('td');
                    if (!cell) {
                        td.textContent = "-";
                        td.className = "empty-cell";
                    } else if (lowerFilter && cell.toLowerCase().includes(lowerFilter)) {
                        const regex = new RegExp(`(${lowerFilter})`, 'gi');
                        td.innerHTML = cell.replace(regex, '<span class="highlight">$1</span>');
                    } else {
                        td.textContent = cell;
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            }
        });

        if (visibleCount === 0) {
            noResultsEl.style.display = "block";
        } else {
            noResultsEl.style.display = "none";
        }
    }

    function searchTable() {
        const filter = document.getElementById('searchInput').value;
        renderTable(filter);
    }

    // Initial render
    renderTable();
</script>
</div>
